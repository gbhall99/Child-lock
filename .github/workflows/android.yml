name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testSideloadDebugUnitTest testPlayDebugUnitTest

      # Release shrinking and lint break at tag time otherwise, when it is too late.
      - name: Lint (debug and release)
        run: ./gradlew --no-daemon lintPlayDebug lintPlayRelease

      # textReport puts the findings in the log above; keep the full HTML/XML too.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-reports
          path: app/build/reports/lint-results-*
          if-no-files-found: ignore

      - name: Build both flavours
        run: ./gradlew --no-daemon assembleSideloadDebug assemblePlayRelease

      - uses: actions/upload-artifact@v4
        with:
          name: childlock-sideload-debug-apk
          path: app/build/outputs/apk/sideload/debug/app-sideload-debug.apk

  release:
    # Signed Play bundle on a v* tag. See RELEASING.md.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Require signing secrets
        env:
          KEYSTORE: ${{ secrets.CHILDLOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Signing secrets are missing; refusing to produce an unsigned bundle."
            exit 1
          fi

      - name: Restore upload keystore
        run: echo "${{ secrets.CHILDLOCK_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"

      # Every tag must ship a distinct version code, or Play rejects the upload.
      - name: Derive version code from the tag
        run: |
          echo "CHILDLOCK_VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Build release bundle
        env:
          CHILDLOCK_STOREFILE: ${{ runner.temp }}/upload.jks
          CHILDLOCK_STOREPASSWORD: ${{ secrets.CHILDLOCK_STOREPASSWORD }}
          CHILDLOCK_KEYALIAS: ${{ secrets.CHILDLOCK_KEYALIAS }}
          CHILDLOCK_KEYPASSWORD: ${{ secrets.CHILDLOCK_KEYPASSWORD }}
        run: ./gradlew --no-daemon bundlePlayRelease

      - uses: actions/upload-artifact@v4
        with:
          name: childlock-play-release-bundle
          path: app/build/outputs/bundle/playRelease/app-play-release.aab

      # The same bundle on the Releases page, so it can be fetched without the
      # Actions UI. The release body is filled in by hand in Play Console anyway.
      - uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/bundle/playRelease/app-play-release.aab
          generate_release_notes: true
