name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon test
      - name: Lint
        run: ./gradlew --no-daemon lintDebug
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: childlock-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  release:
    # Signed Play bundle, only when the signing secrets exist (see RELEASING.md).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore upload keystore
        if: ${{ secrets.CHILDLOCK_KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.CHILDLOCK_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
      - name: Build release bundle
        env:
          CHILDLOCK_STOREFILE: ${{ runner.temp }}/upload.jks
          CHILDLOCK_STOREPASSWORD: ${{ secrets.CHILDLOCK_STOREPASSWORD }}
          CHILDLOCK_KEYALIAS: ${{ secrets.CHILDLOCK_KEYALIAS }}
          CHILDLOCK_KEYPASSWORD: ${{ secrets.CHILDLOCK_KEYPASSWORD }}
        run: ./gradlew --no-daemon bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: childlock-release-bundle
          path: app/build/outputs/bundle/release/app-release.aab
