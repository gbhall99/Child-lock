name: Store media

# Everything visual a Play submission needs, on demand: the Robolectric
# screenshots and rendered store assets, an emulator recording for the
# accessibility and foreground-service declarations, and both debug APKs.
# Actions → Store media → Run workflow, then download the artifacts.
on:
  workflow_dispatch:
  # Also whenever the recording script or this file changes, on any branch,
  # since a new workflow cannot be dispatched until it has reached main.
  push:
    paths:
      - .github/workflows/store-media.yml
      - scripts/record-demo.sh
      - scripts/render-store-assets.sh

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Render every screen (store shots and the trial journey)
        run: |
          mkdir -p store/media/shots
          CHILDLOCK_SHOTS="$PWD/store/media/shots" ./gradlew --no-daemon testPlayDebugUnitTest --tests '*ScreenshotTest*'

      - name: Compose the store assets
        run: scripts/render-store-assets.sh

      - uses: actions/upload-artifact@v4
        with:
          name: store-screenshots
          path: |
            store/media/shots
            store/assets/*.png

  video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Build both debug flavours
        run: ./gradlew --no-daemon assemblePlayDebug assembleSideloadDebug

      - uses: actions/upload-artifact@v4
        with:
          name: childlock-debug-apks
          path: |
            app/build/outputs/apk/play/debug/app-play-debug.apk
            app/build/outputs/apk/sideload/debug/app-sideload-debug.apk

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Record the declaration video
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: scripts/record-demo.sh app/build/outputs/apk/play/debug/app-play-debug.apk store/media

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-video
          path: store/media
          if-no-files-found: warn

  publish:
    # The same files on the Releases page under the "store-media" pre-release,
    # replaced on every run, so they can be fetched without the Actions UI.
    needs: [screenshots, video]
    if: always() && needs.screenshots.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Bundle the screenshots
        run: |
          cd out/store-screenshots && zip -qr ../store-screenshots.zip . && cd ../..
          ls -R out | head -50
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: store-media
          name: Store media (latest run)
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            Built from `${{ github.sha }}` by the Store media workflow, run ${{ github.run_number }}.
            Screenshots zip: store shots, the trial journey, and the composed store assets.
            Video: emulator recording for the Play declarations (see demo.log for what happened).
            APKs: play-debug (what Play will ship, debug-signed) and sideload-debug (the personal build).
          files: |
            out/store-screenshots.zip
            out/store-video/*
            out/childlock-debug-apks/**/*.apk
